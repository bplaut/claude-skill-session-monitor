<title>Session Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column for a slim browser window beside the app; a status bar, then one row per Active session, the ones waiting on you first. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --sunk: #e9edf1; --line: #d3dae1;
  --ink: #17212b; --muted: #5d6b79; --faint: #66727f;
  --you: #b3321b; --you-bg: #fbe9e4; --run: #8a5a00; --run-bg: #fbf0d6;
  --link: #1f4f8f;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --surface: #1a2129; --sunk: #0e1317; --line: #2e3944;
  --ink: #e4e9ee; --muted: #9aa7b4; --faint: #6f7c89;
  --you: #ff8a70; --you-bg: #3a1c15; --run: #e6b450; --run-bg: #33290f;
  --link: #8ab8f0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #1a2129; --sunk: #0e1317; --line: #2e3944;
  --ink: #e4e9ee; --muted: #9aa7b4; --faint: #6f7c89;
  --you: #ff8a70; --you-bg: #3a1c15; --run: #e6b450; --run-bg: #33290f;
  --link: #8ab8f0; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45;
  padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.board { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 { font-size: 16px; font-weight: 600; margin: 0; }
h1 .n { color: var(--you); }
.stamp { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.banner { border: 1px solid var(--line); background: var(--sunk); color: var(--muted); padding: 8px 12px; font-size: 13px; }
.banner.stale { border-color: var(--you); background: var(--you-bg); color: var(--you); }
.rows { background: var(--surface); border: 1px solid var(--line); }
.rows.dim { opacity: .5; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: baseline; }
.row:first-child { border-top: 0; }
.row > * { min-width: 0; }
.row.quiet { padding-block: 7px; background: var(--sunk); }
.row.quiet .title { font-weight: 500; }
.row.quiet .what { color: var(--muted); }
.chip { grid-column: 1 / -1; justify-self: start; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; }
.chip.you { background: var(--you-bg); color: var(--you); }
.chip.run { background: var(--run-bg); color: var(--run); }
.chip.working, .chip.idle { color: var(--faint); padding-left: 0; }
.title { font-weight: 600; color: var(--link); text-underline-offset: 2px; overflow-wrap: anywhere; }
span.title { color: var(--ink); }
.what, .then { grid-column: 1 / -1; overflow-wrap: anywhere; }
.then { color: var(--muted); }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.empty { padding: 18px 12px; color: var(--muted); }
.foot { font-size: 12px; color: var(--faint); }
</style>

<div class="board">
  <div class="bar">
    <h1 id="count">Session board</h1>
    <span class="stamp" id="checked">not written yet</span>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="rows" id="rows"><div class="empty">No rows yet. Type /monitor in the monitor session; sessions in your Active group appear here.</div></div>
  <div class="foot" id="foot">Open this page in a browser window. Session links do nothing inside the Claude app.</div>
</div>

<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  var RANK = { you: 0, run: 1, working: 2, idle: 3 };
  var LABEL = { you: 'on you', run: 'on a run', working: 'working', idle: 'idle' };
  var SESSION = /^local_[A-Za-z0-9-]+$/;
  var cards = [], meta = null, confirmed = false, storeNote = '';

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function hhmm(ms) { var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function waited(since) {
    var ms = Date.now() - Date.parse(since);
    if (!(ms >= 0)) return '';
    var m = Math.floor(ms / 60000);
    if (m < 60) return m + 'm';
    if (m < 2880) return Math.floor(m / 60) + 'h';
    return Math.floor(m / 1440) + 'd';
  }
  function stateOf(c) { return RANK.hasOwnProperty(c.state) ? c.state : 'idle'; }

  function render() {
    var you = cards.filter(function (c) { return stateOf(c) === 'you'; }).length;
    var run = cards.filter(function (c) { return stateOf(c) === 'run'; }).length;
    var h = $('count'); h.textContent = '';
    if (cards.length) {
      h.appendChild(el('span', you ? 'n' : '', you ? you + ' on you' : 'Nothing on you'));
      if (run) h.appendChild(document.createTextNode(' · ' + run + ' on a run'));
    } else { h.textContent = 'Session board'; }
    $('checked').textContent = meta && meta.checkedAt ? 'checked ' + String(meta.checkedAt) : 'not written yet';

    // The page judges staleness by its own clock, so it shows even when the monitor is gone.
    // A next-check time that is missing or unreadable counts as stale: the page must fail toward red.
    var stopped = meta && meta.stopped;
    var nextMs = meta ? Date.parse(meta.nextBy) : NaN;
    var unreadable = cards.length > 0 && !(nextMs > 0);
    var late = !stopped && (unreadable || Date.now() > nextMs + 120000);
    var clusterMs = meta && meta.clusterOkAt ? Date.parse(meta.clusterOkAt) : NaN;
    var clusterOld = !(clusterMs > 0) || Date.now() - clusterMs > 180000;
    var clusterDown = run > 0 && !stopped && !late && clusterOld;
    var banner = $('banner'), text = '';
    if (stopped) text = 'Stopped at ' + String(meta.stopped) + '. Type /monitor in the monitor session to start it.';
    else if (unreadable) text = 'Stale: the board has no readable next-check time. Type /monitor in the monitor session.';
    else if (late) text = 'Stale: last checked ' + String(meta.checkedAt) + '. Type /monitor in the monitor session.';
    else if (storeNote) text = storeNote;
    else if (meta && meta.note) text = String(meta.note);
    else if (clusterDown) text = 'cluster unreadable since ' + (clusterMs > 0 ? hhmm(clusterMs) : 'the start') + ': is the poller running?';
    banner.hidden = !text; banner.textContent = text;
    banner.className = 'banner' + (late ? ' stale' : '');

    var rows = $('rows'); rows.className = 'rows' + (late || stopped ? ' dim' : '');
    rows.textContent = '';
    if (!cards.length) {
      rows.appendChild(el('div', 'empty', meta ? 'No sessions in your Active group.' : 'No rows yet. Type /monitor in the monitor session; sessions in your Active group appear here.'));
      return;
    }
    function when(c) { var t = Date.parse(c.since); return t > 0 ? t : 0; }
    cards.slice().sort(function (a, b) {
      return (RANK[stateOf(a)] - RANK[stateOf(b)]) || (when(b) - when(a));
    }).forEach(function (c) {
      var state = stateOf(c), quiet = state === 'working' || state === 'idle';
      var row = el('div', 'row' + (quiet ? ' quiet' : ''));
      row.appendChild(el('span', 'chip ' + state, LABEL[state]));
      var id = String(c.sessionId || ''), title;
      if (SESSION.test(id)) {
        title = el('a', 'title', String(c.title || id));
        title.href = 'claude://claude.ai/epitaxy/' + id; title.target = '_blank'; title.rel = 'noopener';
      } else { title = el('span', 'title', String(c.title || c.id)); }
      row.appendChild(title);
      // A run the cluster can show is as fresh as the last cluster read; a card's own
      // asOf is only for runs the monitor cannot see, and is the session's word.
      var stamp = '';
      if (state === 'you') stamp = waited(c.since);
      else if (state === 'run' && c.asOf) stamp = 'as of ' + String(c.asOf);
      else if (state === 'run') stamp = clusterOld ? 'cluster unread' : 'as of ' + hhmm(clusterMs);
      row.appendChild(el('span', 'stamp', stamp));
      if (c.what) row.appendChild(el('span', 'what', String(c.what)));
      if (c.then) row.appendChild(el('span', 'then', String(c.then)));
      rows.appendChild(row);
    });
  }

  var db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) { storeNote = 'This view cannot reach the board\'s data. Open the page on claude.ai in a browser.'; render(); return; }
  var slow = setTimeout(function () { if (!confirmed) { storeNote = 'No answer from the board\'s data after 10 seconds; this may be out of date.'; render(); } }, 10000);
  var broken = false;
  function got(fromCache) { if (!fromCache && !broken) { confirmed = true; clearTimeout(slow); storeNote = ''; } }
  function failed(e) { broken = true; clearTimeout(slow); storeNote = 'Could not read the board\'s data (' + String(e && e.code) + '). Reload the page.'; render(); }
  db.collection('cards').onSnapshot(function (snap) {
    cards = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data() || {}); });
    got(snap.metadata.fromCache); render();
  }, failed);
  db.doc('meta/board').onSnapshot(function (s) {
    meta = s.exists ? s.data() : null; got(s.metadata.fromCache); render();
  }, failed);
  setInterval(render, 5000);
})();
</script>
